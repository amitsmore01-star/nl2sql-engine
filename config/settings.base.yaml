# config/settings.base.yaml
# V0 - Initial implementation
# V1 - Updated in Story 2.1: default_top_rows and max_nl_query_length set to 0
#      0 means no limit applied — SQL Builder omits TOP clause, API skips length check
# Shared config — all environments
# All keys must be declared here. Dev/prod may override values but never introduce new keys.

app:
  name: nl2sql-engine
  version: "1.0"
  schema_dir: schemas

api:
  port: 8000
  prefix: /v1

llm:
  provider: mock
  max_tokens: 1000
  timeout_seconds: 30
  retry_max: 3
  retry_backoff_seconds: 2
  step1_token_target: 1000
  step2_token_target: 1200

sql:
  default_top_rows: 0        # 0 = omit TOP clause entirely. Any positive number = SELECT TOP {n}
  max_nl_query_length: 0     # 0 = no length limit enforced. Any positive number = enforce limit

logging:
  level: INFO
  rotation: daily
  log_dir: logs
  log_archive_dir: logs/archive